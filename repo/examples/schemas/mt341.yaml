---
# MT341 (Forward Rate Agreement Settlement Confirmation) — starter schema. Sequence A is root-level; each later
# sequence is introduced by an empty `:15x:` marker tag with NO :16R:/:16S:
# wrapper, so each is an *anchored* sequence (ADR-0013) whose members are the
# tags listed below. Fixture: prowide-core MT341.fin. Not a licensed SRU import; network
# validation rules are not reproduced.
field_types:
- name: mt341_text
  pattern:
  - kind: rest
    name: value

