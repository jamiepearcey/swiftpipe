---
# MT942 (Interim Transaction Report) — starter schema per the SWIFT User Handbook field list;
# fields captured verbatim, decoded downstream. Not a licensed SRU import;
# network validation rules are not reproduced.
# Repeating groups have no :16R:/:16S: wrapper: anchored sequences (ADR-0013).
field_types:
- name: mt942_text
  pattern:
  - kind: rest
    name: value

messages:
- message: MT942
  category: cash
  version: starter
  coverage:
    source: SWIFT User Handbook field list; not a licensed SRU import.
    exact: false
    expected_sequences: 1
    expected_fields: 11
    notes:
    - "Statement lines anchored on :61:; totals 90D/90C appear after entries."
  sequences:
    ENTRY:
      anchor_tag: "61"
      member_tags: ["86"]
      repeat: true
  fields:
  - path: $
    tag: "20"
    name: transaction_reference
    type: mt942_text
    required: true
    min: 1
    max: 1
    entity: mt942_message
    column: transaction_reference
  - path: $
    tag: "21"
    name: related_reference
    type: mt942_text
    max: 1
    entity: mt942_message
    column: related_reference
  - path: $
    tag: "25"
    name: account_identification
    type: mt942_text
    required: true
    min: 1
    max: 1
    entity: mt942_message
    column: account_identification
  - path: $
    tag: "28C"
    name: statement_number
    type: mt942_text
    max: 1
    entity: mt942_message
    column: statement_number
  - path: $
    tag: "28"
    name: statement_number_legacy
    type: mt942_text
    max: 1
    entity: mt942_message
    column: statement_number_legacy
  - path: $
    tag: "34F"
    name: floor_limit
    type: mt942_text
    entity: mt942_message
    column: floor_limit
  - path: $
    tag: "13D"
    name: date_time_indication
    type: mt942_text
    max: 1
    entity: mt942_message
    column: date_time_indication
  - path: $
    tag: "90D"
    name: debit_totals
    type: mt942_text
    max: 1
    entity: mt942_message
    column: debit_totals
  - path: $
    tag: "90C"
    name: credit_totals
    type: mt942_text
    max: 1
    entity: mt942_message
    column: credit_totals
  - path: $
    tag: "86"
    name: statement_narrative
    type: mt942_text
    max: 1
    entity: mt942_message
    column: statement_narrative
  - path: ENTRY
    tag: "61"
    name: entry_statement_line
    type: mt942_text
    required: true
    min: 1
    max: 1
    entity: mt942_entry
    column: statement_line
  - path: ENTRY
    tag: "86"
    name: entry_entry_narrative
    type: mt942_text
    max: 1
    entity: mt942_entry
    column: entry_narrative
