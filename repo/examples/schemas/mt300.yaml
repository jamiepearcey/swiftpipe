---
# MT300 (Foreign Exchange Confirmation) — starter schema. Sequence A is root-level; each later
# sequence is introduced by an empty `:15x:` marker tag with NO :16R:/:16S:
# wrapper, so each is an *anchored* sequence (ADR-0013) whose members are the
# tags listed below. Fixture: prowide-core SWIFTMT300_0000039099_0002.txt. Not a licensed SRU import; network
# validation rules are not reproduced.
field_types:
- name: mt300_text
  pattern:
  - kind: rest
    name: value

messages:
- message: MT300
  category: treasury
  version: starter
  coverage:
    source: SWIFT Category 3 field list per SWIFT User Handbook; not a licensed SRU import.
    exact: false
    expected_sequences: 2
    expected_fields: 31
    notes:
    - "Sequences anchored on empty :15x: markers; member tags per public fixtures and handbook."
  sequences:
    B:
      anchor_tag: "15B"
