---
# MT200 (Financial Institution Transfer for its Own Account) — starter schema per the SWIFT User Handbook field list;
# fields captured verbatim, decoded downstream. Not a licensed SRU import;
# network validation rules are not reproduced.
field_types:
- name: mt200_text
  pattern:
  - kind: rest
    name: value

messages:
- message: MT200
  category: payments
  version: starter
  coverage:
    source: SWIFT User Handbook field list; not a licensed SRU import.
    exact: false
    expected_sequences: 0
    expected_fields: 6
    notes:
    - "Flat message."
  fields:
  - path: $
    tag: "20"
    name: transaction_reference
    type: mt200_text
    required: true
    min: 1
    max: 1
    entity: mt200_message
    column: transaction_reference
  - path: $
    tag: "32A"
    name: value_date_currency_amount
    type: mt200_text
    required: true
    min: 1
    max: 1
    entity: mt200_message
    column: value_date_currency_amount
  - path: $
    tag: 53a
    options: ["B"]
    name: senders_correspondent
    type: mt200_text
    max: 1
    entity: mt200_message
    column: senders_correspondent
    render:
      option: B
  - path: $
    tag: 56a
    options: ["A", "D"]
    name: intermediary
    type: mt200_text
    max: 1
    entity: mt200_message
    column: intermediary
    render:
      option: A
  - path: $
    tag: 57a
    options: ["A", "B", "D"]
    name: account_with_institution
    type: mt200_text
    required: true
    min: 1
    max: 1
    entity: mt200_message
    column: account_with_institution
    render:
      option: A
  - path: $
    tag: "72"
    name: sender_to_receiver_information
    type: mt200_text
    max: 1
    entity: mt200_message
    column: sender_to_receiver_information
