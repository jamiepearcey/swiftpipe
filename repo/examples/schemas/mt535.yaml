---
field_types:
- name: settlement_reference
  pattern:
  - kind: literal
    value: ":"
  - kind: capture
    name: qualifier
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "//"
  - kind: rest
    name: value
- name: settlement_date
  pattern:
  - kind: literal
    value: ":"
  - kind: capture
    name: qualifier
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "//"
  - kind: capture
    name: date
    value_type: digits
    length: 8
- name: settlement_datetime_text
  pattern:
  - kind: rest
    name: value
- name: settlement_quantity
  pattern:
  - kind: literal
    value: ":"
  - kind: capture
    name: qualifier
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "//"
  - kind: rest
    name: quantity
- name: settlement_amount
  pattern:
  - kind: literal
    value: ":"
  - kind: capture
    name: qualifier
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "//"
  - kind: rest
    name: amount
- name: settlement_qualified_code
  pattern:
  - kind: literal
    value: ":"
  - kind: capture
    name: qualifier
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "//"
  - kind: rest
    name: code
- name: settlement_text
  pattern:
  - kind: rest
    name: value
- name: mt535_aggregate_balance
  # 93B at Subsequence B1 (FIN): qualifier//balance-type/quantity. Selects
  # the balance-type code (FAMT/UNIT); see mt535_aggregate_quantity for the
  # sibling rule that selects the quantity out of the same wire shape.
  # Source: docs/domain/mt535-sub-balances.md (broker-recon) §5.2 — verified
  # structure (§1 Subsequence B1).
  pattern:
  - kind: literal
    value: ":"
  - kind: capture
    name: qualifier
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "//"
  - kind: capture
    name: value
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "/"
  - kind: rest
    name: residual
- name: mt535_aggregate_quantity
  # Same 93B wire shape as mt535_aggregate_balance; selects the signed
  # quantity instead of the balance-type code.
  pattern:
  - kind: literal
    value: ":"
  - kind: capture
    name: qualifier
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "//"
  - kind: capture
    name: unit
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "/"
  - kind: rest
    name: quantity
- name: mt535_sub_balance_type
  # 93C at Subsequence B1b (SUBBAL): qualifier//balance-type/sub-balance-type/
  # quantity. At this position the qualifier is the fixed structural literal
  # OTHR (see mt535-sub-balances.md §1's explicit warning: OTHR here means
  # "see the embedded sub-type code", not a balance-type value). Selects the
  # sub-balance-type code (LOAN, PLED, BLOK, ...).
  pattern:
  - kind: literal
    value: ":"
  - kind: capture
    name: qualifier
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "//"
  - kind: capture
    name: unit
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "/"
  - kind: capture
    name: code
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "/"
  - kind: rest
    name: residual
- name: mt535_sub_balance_quantity
  # Same 93C wire shape as mt535_sub_balance_type; selects the signed
  # quantity instead of the sub-balance-type code.
  pattern:
  - kind: literal
    value: ":"
  - kind: capture
    name: qualifier
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "//"
  - kind: capture
    name: unit
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "/"
  - kind: capture
    name: subtype
    value_type: alpha_num
    length: 4
  - kind: literal
    value: "/"
  - kind: rest
    name: quantity
messages:
- message: MT535
  category: securities
  version: starter
  coverage:
    source: starter schema derived from common settlement instruction structure; not
      licensed SRU import
    exact: false
    expected_sequences: 10
    expected_fields: 24
    notes:
    - Models common GENL, TRADDET, FIAC, SETDET, SETPRTY, and amount/date/reference
      fields.
    - Exact reproduction requires licensed SWIFT/ISO source import and full network
      validation rules.
    - SUBBAL (Subsequence B1b, nested under FIN) added per broker-recon issue 1
      (swiftpipe UnknownSequence on real MT535 holdings messages) and
      docs/domain/mt535-sub-balances.md. Field rules cover the verified
      structure only -- 35B instrument id and 93B::AGGR (aggregate balance) at
      FIN, and 93C::OTHR (detailed sub-balance, e.g. LOAN/PLED/BLOK) at
      SUBBAL. The alternate 93B::AVAI/NAVL-inside-SUBBAL binary-availability
      form is deliberately NOT modeled -- that document's §1 flags a genuine,
      unresolved structural ambiguity between the NVR text (which reads as if
      AVAI/NAVL nest inside SUBBAL) and the one-page structural reference
      (which places them at FIN level, before SUBBAL) -- confirm against a
      real multi-instrument sample or the licensed SRU before adding it.
    - AGGR (aggregate, at FIN) and the SUBBAL-nested sub-balance are modeled
      as distinct entities/columns on purpose -- AGGR is the total holding,
      not an available/encumbrance-adjusted figure, and the two must never be
      read as interchangeable downstream.
    - None of the new SUBSAFE/FIN/SUBBAL field rules are marked required --
      this schema already models two structurally-incompatible MT535 shapes
      in one file (the pre-existing TRADDET/FIAC/SETDET settlement-instruction
      fields, and this addition's holdings-statement fields), and a message
      using one shape legitimately has zero occurrences of the other's
      sequences. required (and min>0) is message-wide, not per-occurrence-of-
      an-optional-parent, in this schema engine, so marking any of these
      fields required breaks materialization of every message that uses the
      other shape.
  sequences:
    GENL: {}
    STAT:
      parent: GENL
      repeat: true
    REAS:
      parent: STAT
      repeat: true
    SUBSAFE:
      repeat: true
    FIN:
      parent: SUBSAFE
      repeat: true
    SUBBAL:
      parent: FIN
      repeat: true
    FXORDER:
      repeat: true
    ORDRPRTY:
      parent: FXORDER
      repeat: true
    ORDRDET:
      repeat: true
    FIA:
      parent: ORDRDET
      repeat: true
    TRADPRTY:
      parent: ORDRDET
      repeat: true
    TRADE:
      repeat: true
    CONFDET:
      repeat: true
    CONFPRTY:
      parent: CONFDET
      repeat: true
    USECU:
      repeat: true
    ACCTINFO:
      parent: USECU
      repeat: true
    CADETL:
      repeat: true
    CAOPTN:
      repeat: true
    CACONF:
      repeat: true
    CASHMOVE:
      parents:
      - CAOPTN
      - CACONF
      repeat: true
    SECMOVE:
      parent: CACONF
      repeat: true
    CAINST:
      repeat: true
    ADDINFO:
      repeat: true
    LINK:
      parents:
      - GENL
      - TRADDET
      repeat: true
    TRADDET:
      repeat: true
    FIAC:
      parent: TRADDET
      repeat: true
    SETDET:
      repeat: true
    SETPRTY:
      parent: SETDET
      repeat: true
    CSHPRTY:
      parent: SETDET
      repeat: true
    AMT:
      parent: SETDET
      repeat: true
    OTHRPRTY:
      parent: SETDET
      repeat: true
  fields:
  - path: GENL
    tag: 20C
    qualifier: SEME
    name: sender_reference
    type: settlement_reference
    required: true
    min: 1
    max: 1
    entity: settlement_instruction
    column: sender_reference
  - path: GENL
    tag: 23G
    name: function
    type: settlement_text
    required: true
    min: 1
    max: 1
    entity: settlement_instruction
    column: function
  - path: GENL
    tag: 98a
    options:
    - A
    - C
    - E
    name: preparation_date
    type: settlement_datetime_text
    option_types:
      A: settlement_date
      C: settlement_datetime_text
      E: settlement_datetime_text
    entity: settlement_instruction
    column: preparation_date
    render:
      option: A
      qualifier: PREP
  - path: GENL
    tag: 16R
    name: sequence_marker
    type: settlement_text
    entity: settlement_audit
    column: marker
  - path: GENL/LINK
    tag: 20C
    name: linked_reference
    type: settlement_reference
    entity: settlement_link
    column: linked_reference
    render:
      qualifier: RELA
  - path: TRADDET
    tag: 98a
    options:
    - A
    - B
    - C
    - E
    qualifier: TRAD
    name: trade_date
    type: settlement_datetime_text
    option_types:
      A: settlement_date
      B: settlement_datetime_text
      C: settlement_datetime_text
      E: settlement_datetime_text
    entity: settlement_trade
    column: trade_date
    render:
      option: A
      qualifier: TRAD
  - path: TRADDET
    tag: 98a
    options:
    - A
    - B
    - C
    - E
    qualifier: SETT
    name: settlement_date
    type: settlement_datetime_text
    option_types:
      A: settlement_date
      B: settlement_datetime_text
      C: settlement_datetime_text
      E: settlement_datetime_text
    entity: settlement_trade
    column: settlement_date
    render:
      option: A
      qualifier: SETT
  - path: TRADDET
    tag: 35B
    name: financial_instrument
    type: settlement_text
    max: 1
    entity: settlement_trade
    column: instrument
  - path: TRADDET
    tag: 22F
    name: trade_indicator
    type: settlement_qualified_code
    entity: settlement_trade_indicator
    column: indicator
    render:
      qualifier: STCO
  - path: TRADDET/LINK
    tag: 20C
    name: trade_linked_reference
    type: settlement_reference
    entity: settlement_trade_link
    column: linked_reference
    render:
      qualifier: RELA
  - path: TRADDET/FIAC
    tag: 36B
    name: settlement_quantity
    type: settlement_quantity
    entity: settlement_quantity
    column: quantity
    render:
      qualifier: SETT
  - path: TRADDET/FIAC
    tag: 97a
    options:
    - A
    - B
    - D
    name: safekeeping_account
    type: settlement_reference
    entity: settlement_account
    column: safekeeping_account
    render:
      option: A
      qualifier: SAFE
  - path: SETDET
    tag: 22F
    name: settlement_indicator
    type: settlement_qualified_code
    entity: settlement_indicator
    column: indicator
    render:
      qualifier: STCO
  - path: SETDET
    tag: 22H
    name: settlement_method
    type: settlement_qualified_code
    entity: settlement_indicator
    column: method
    render:
      qualifier: REDE
  - path: SETDET/SETPRTY
    tag: 95a
    options:
    - C
    - D
    - L
    - P
    - Q
    - R
    name: settlement_party
    type: settlement_qualified_code
    entity: settlement_party
    column: party
    render:
      option: P
      qualifier: PSET
  - path: SETDET/SETPRTY
    tag: 97a
    options:
    - A
    - B
    - D
    name: settlement_party_account
    type: settlement_reference
    entity: settlement_party
    column: account
    render:
      option: A
      qualifier: SAFE
  - path: SETDET/CSHPRTY
    tag: 95a
    options:
    - C
    - D
    - L
    - P
    - Q
    - R
    name: cash_party
    type: settlement_qualified_code
    entity: settlement_cash_party
    column: party
    render:
      option: P
      qualifier: PSET
  - path: SETDET/AMT
    tag: 19A
    name: settlement_amount
    type: settlement_amount
    entity: settlement_amount
    column: amount
    render:
      qualifier: SETT
  - path: SETDET/OTHRPRTY
    tag: 95a
    options:
    - C
    - D
    - L
    - P
    - Q
    - R
    name: other_party
    type: settlement_qualified_code
    entity: settlement_other_party
    column: party
    render:
      option: P
      qualifier: PSET

  # --- Subsequence B1 (FIN) / B1b (SUBBAL): holdings statement content ---
  # Added per broker-recon issue #1 and docs/domain/mt535-sub-balances.md
  # §5.1-5.3 (verified structure only; see the coverage.notes flag above
  # for the one deliberately-omitted, unresolved ambiguity).
  - path: SUBSAFE/FIN
    tag: 35B
    name: sub_safekeeping_instrument
    type: settlement_text
    max: 1
    entity: mt535_balance
    column: instrument
  - path: SUBSAFE/FIN
    tag: 93a
    options:
    - B
    qualifier: AGGR
    name: aggregate_balance_type
    type: mt535_aggregate_balance
    entity: mt535_balance
    column: balance_type
    render:
      option: B
      qualifier: AGGR
  - path: SUBSAFE/FIN
    tag: 93a
    options:
    - B
    qualifier: AGGR
    name: aggregate_quantity
    type: mt535_aggregate_quantity
    entity: mt535_balance
    column: quantity
    render:
      option: B
      qualifier: AGGR
  - path: SUBSAFE/FIN/SUBBAL
    tag: 93a
    options:
    - C
    qualifier: OTHR
    name: sub_balance_type
    type: mt535_sub_balance_type
    entity: mt535_sub_balance
    column: sub_balance_type
    render:
      option: C
      qualifier: OTHR
  - path: SUBSAFE/FIN/SUBBAL
    tag: 93a
    options:
    - C
    qualifier: OTHR
    name: sub_balance_quantity
    type: mt535_sub_balance_quantity
    entity: mt535_sub_balance
    column: quantity
    render:
      option: C
      qualifier: OTHR
