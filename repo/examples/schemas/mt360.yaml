---
# MT360 (Single Currency Interest Rate Derivative Confirmation) — starter schema. Sequence A is root-level; each later
# sequence is introduced by an empty `:15x:` marker tag with NO :16R:/:16S:
# wrapper, so each is an *anchored* sequence (ADR-0013) whose members are the
# tags listed below. Fixture: prowide-core MT360.fin. Not a licensed SRU import; network
# validation rules are not reproduced.
field_types:
- name: mt360_text
  pattern:
  - kind: rest
    name: value

messages:
- message: MT360
  category: treasury
  version: starter
  coverage:
    source: SWIFT Category 3 field list per SWIFT User Handbook; not a licensed SRU import.
    exact: false
    expected_sequences: 4
    expected_fields: 37
    notes:
    - "Sequences anchored on empty :15x: markers; member tags per public fixtures and handbook."
  sequences:
    B:
      anchor_tag: "15B"
      member_tags: ["14A", "14D", "17F", "18A", "22B", "30F", "37U"]
      repeat: true
    D:
      anchor_tag: "15D"
      member_tags: ["57A", "57D", "57J"]
      repeat: true
    F:
      anchor_tag: "15F"
      member_tags: ["14A", "14D", "14F", "14J", "17F", "18A", "22B", "30F", "37R", "38E"]
      repeat: true
    G:
      anchor_tag: "15G"
      member_tags: ["57A", "57D", "57J"]
      repeat: true
  fields:
