[package]
name = "swift-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
repository = "https://github.com/jamiepearcey/swiftpipe"

[package.metadata.dist]
dist = true

[[bin]]
name = "swiftpipe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
duckdb = { version = "1.10501.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
swift-core = { path = "../swift-core" }
swift-db = { path = "../swift-db" }
swift-duckdb = { path = "../swift-duckdb" }
swift-schema = { path = "../swift-schema" }
toml = "0.8"
