[package]
name = "swift-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[dependencies]
memchr = "2.7"
smallvec = "1.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "parse_message"
harness = false

[[bench]]
name = "parse_allocations"
harness = false
