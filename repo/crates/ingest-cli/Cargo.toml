[package]
name = "ingest-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[[bin]]
name = "ingest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `serve` subcommand: the recon read-model service (axum) querying the Parquet
# store via DuckDB. Matches swift-api's duckdb pin so the bundled build is shared.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
duckdb = { version = "1.10501.0", features = ["bundled"] }
ingest-core = { path = "../ingest-core" }
ingest-parquet = { path = "../ingest-parquet" }
ingest-penalty = { path = "../ingest-penalty" }
ingest-pnl = { path = "../ingest-pnl" }
ingest-tabular = { path = "../ingest-tabular" }
swift-core = { path = "../swift-core" }
swift-db = { path = "../swift-db" }
swift-schema = { path = "../swift-schema" }
swift-normalize = { path = "../swift-normalize" }
swift-mt940 = { path = "../swift-mt940" }
mx-camt = { path = "../mx-camt" }

[dev-dependencies]
tempfile = "3"
