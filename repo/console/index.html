<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%237c5cff'/%3E%3Cpath d='M5 7h14M5 12h14M5 17h9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>swiftpipe · console</title>
    <!-- Apply the saved theme before first paint to avoid a dark→light flash
         (FOUC). Mirrors lib/settings.ts (KEY "swiftpipe-console:settings"). -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("swiftpipe-console:settings") || "{}");
          var light = s && s.theme === "light";
          var el = document.documentElement;
          el.classList.toggle("light", light);
          el.classList.toggle("dark", !light);
        } catch (e) {
          /* default class on <html> stays */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
